<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAVE DKU | AX-EL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Freesentation';src:url('fonts/Freesentation-7Bold.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Freesentation';src:url('fonts/Freesentation-9Black.woff2') format('woff2');font-weight:900;font-display:swap}
/* VOICE: 젊고 산뜻한 미션 게임. 교수님을 '요원'으로 초대하되 말투는 정중함
   IDEA: 몽환적인 파스텔 하늘 위의 홀로그램 프로젝터 — 미션을 깰 때마다 단국대 평가 시스템 복구율이 올라감
   PICTURE: 클레이 질감의 프로젝터, 유리 패널, 머그, 구슬 오브젝트, 뒤로 흐르는 거대한 세리프 티커
   COLOUR and TYPE: 라벤더→핑크→피치 하늘, 바이올렛 강조, 유리 카드. Instrument Serif(영문 디스플레이) + Freesentation(국문 헤드라인) + Noto Sans KR 본문
   LAYOUT: 히어로(이름 입력→출발) → 스쿼드 선택 → 좌측 세로 내비 + 미션 카드 + 우측 AI 코파일럿 */
:root{color-scheme:light;--ink:#2c2a63;--mut:#5b5880;--vio:#f05d2d;--vio2:#d9481c;--peach:#ffb37a;--pink:#fe8739;--mint:#2fbf8f;--glass:rgba(255,255,255,.58);--glass2:rgba(255,255,255,.78);--edge:rgba(255,255,255,.85);--line:rgba(107,92,255,.22)}
:root[data-theme=dark],:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:120px}
body{margin:0;color:var(--ink);font:16px/1.6 'Noto Sans KR',system-ui,sans-serif;overflow-x:clip;min-height:100vh;
 background:linear-gradient(180deg,#005eb7 0%,#2f80d3 38%,#9cc4ec 66%,#ffe6af 100%) fixed}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(40% 18% at 12% 62%,#fff4dd88 0,#fff0 70%),radial-gradient(36% 16% at 86% 54%,#fff4dd99 0,#fff0 70%),radial-gradient(50% 20% at 50% 92%,#fff4ddaa 0,#fff0 70%)}
.serif{font-family:'Instrument Serif';font-style:italic,serif;font-weight:400}
.kserif{font-family:'Freesentation','Noto Sans KR',sans-serif;font-weight:900}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:0;border-radius:999px;padding:12px 24px;min-height:46px;background:var(--ink);color:#fff;font-weight:700;box-shadow:0 8px 24px #2c2a6333}
.btn:hover{background:var(--vio2)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{font-size:20px;padding:14px 40px;min-height:56px;background:linear-gradient(135deg,var(--vio),var(--pink));box-shadow:0 12px 36px #f05d2d55}
.ghost{border:1px solid var(--edge);background:var(--glass);backdrop-filter:blur(12px);border-radius:999px;padding:10px 18px;min-height:44px;font-weight:500}
.ghost:hover{background:var(--glass2)}.ghost.s{padding:6px 14px;min-height:38px;font-size:14px}
:focus-visible{outline:3px solid var(--vio);outline-offset:2px}
.glass{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:26px;box-shadow:0 20px 50px #d9481c14}
.note{font-size:13px;color:var(--mut)}
/* hero */
.hero{position:relative;background:#005eb7;overflow:hidden;min-height:100vh;display:flex;flex-direction:column}
.art{position:relative;z-index:1;width:100%;margin:clamp(28px,5vw,64px) 0 0}.art img{display:block;width:100%;height:auto}
.start.mini{width:min(380px,92vw);padding:5px;margin:14px auto 0;box-shadow:0 10px 30px #00306a40}.start.mini input{font-size:16px;min-height:40px;padding:6px 14px}.btn.go{min-height:40px;padding:8px 22px;font-size:16px;background:linear-gradient(135deg,var(--vio),var(--pink))}
.nametag{position:absolute;left:50%;top:2%;transform:translateX(-50%);background:#ffffffe6;border-radius:999px;padding:8px 22px;font-size:clamp(14px,1.8vw,20px);color:var(--ink);white-space:nowrap;box-shadow:0 10px 30px #00306a40}.nametag b{font-family:'Freesentation','Noto Sans KR';font-weight:900}
.ground{background:#fe8739;padding:20px 16px 18px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;z-index:2;flex:1}
.brand{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:16px max(4vw,16px);position:relative;z-index:3;color:#fff}
.brand b{font-weight:900;letter-spacing:0}.brand .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--vio);margin-right:8px}
.hero-c{position:relative;display:grid;justify-items:center;text-align:center;padding:10px 16px 0;z-index:2}
.hello{font-family:'Instrument Serif';font-style:italic;font-size:clamp(24px,3.2vw,36px);color:#fff;margin:6px 0 0;text-shadow:0 2px 20px #00306a66}
.hero h1{font-family:'Freesentation','Noto Sans KR';font-weight:900;font-size:clamp(40px,7vw,84px);line-height:1.05;margin:4px 0 6px;color:#fff;text-wrap:balance;text-shadow:0 4px 30px #00306a88;position:relative;z-index:2}
.welcome{font-size:clamp(16px,2vw,19px);color:#fff;font-weight:500;margin:0;position:relative;z-index:2}
.welcome b{background:#ffffff33;border:1px solid #fff9;border-radius:999px;padding:2px 12px}
.ticker{position:absolute;left:0;right:0;top:58%;transform:translateY(-50%);white-space:nowrap;pointer-events:none;z-index:0;overflow:hidden}
.ticker div{display:inline-block;font-family:'Instrument Serif';font-style:italic;font-size:clamp(90px,16vw,210px);line-height:1;color:transparent;-webkit-text-stroke:1.2px #ffffff59;animation:tick 48s linear infinite}
.ticker span{color:#ffffff1f;-webkit-text-stroke:0}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.device{width:min(680px,96vw);aspect-ratio:600/400;position:relative;z-index:1;margin-top:-6px}
.device svg{width:100%;height:100%;display:block;overflow:visible}
.start{position:relative;z-index:3;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;padding:10px;border-radius:999px;margin:0 auto 14px;max-width:560px;background:#fffffff0}
.start input{flex:1 1 220px;border:0;background:transparent;font:500 17px 'Noto Sans KR';padding:10px 16px;color:var(--ink);min-height:46px}
.start input::placeholder{color:#7a74a3}
.story-hero{max-width:640px;margin:4px auto 0;background:#ffffffeb;text-align:left;color:#2c2a63;font-size:15px;font-size:15px;padding:14px 20px;position:relative;z-index:3}
.vnav{display:flex;align-items:center;gap:18px}
.vnav button{border:0;background:none;color:#fff;font-weight:500;padding:6px 0;font-size:15px;opacity:.85;min-height:40px}
.vnav button.on{font-family:'Instrument Serif';font-style:italic;font-size:22px;opacity:1}
.toggle{display:flex;align-items:center;gap:10px;color:#fff;font-size:14px;border:0;background:none}
.toggle i{width:46px;height:26px;border-radius:99px;background:#ffffff55;position:relative;border:1px solid #fffa}
.toggle i::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .25s}
.toggle.on i{background:var(--vio)}.toggle.on i::after{left:22px}
body.still .ticker div,body.still .float,body.still .spin{animation:none}
.float{animation:float 5s ease-in-out infinite}.spin{transform-origin:300px 250px;animation:spin 60s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.float.b{animation-delay:-2.5s}
@keyframes float{50%{transform:translateY(-8px)}}
@media(prefers-reduced-motion:reduce){.ticker div,.float,.spin{animation:none}}
@media(max-width:700px){.vnav{display:none}}
/* pick */
.wrap{max-width:1240px;margin:0 auto;padding:clamp(18px,3vw,36px) max(4vw,16px)}
.pick h2{font-family:'Freesentation','Noto Sans KR';font-weight:900;font-size:clamp(30px,4.6vw,48px);line-height:1.1;margin:8px 0 6px}
.squads{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:22px 0}
.sq{text-align:left;padding:20px;min-height:190px;display:flex;flex-direction:column;gap:6px;border-radius:24px;border:2px solid var(--edge);background:var(--glass);backdrop-filter:blur(16px)}
.sq.on{border-color:var(--vio);box-shadow:0 0 0 5px #f05d2d33}
.sq .code{font-family:'Instrument Serif';font-style:italic;font-size:40px;line-height:1}
.sq .ar{font-weight:700}.sq small{color:var(--mut)}
.chipc{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border-radius:99px;padding:3px 10px;background:#fff;align-self:flex-start}
.chipc i{width:9px;height:9px;border-radius:50%}
/* app shell */
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);gap:22px;max-width:1300px;margin:0 auto;padding:18px max(3vw,14px) 40px}
.side{position:sticky;top:16px;align-self:start;display:grid;gap:14px}
.me{padding:16px}.me .code{font-family:'Instrument Serif';font-style:italic;font-size:34px;line-height:1}.me small{display:block;color:var(--mut);font-size:13px}
.xp-l{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin:10px 0 4px}.xp-l b{color:var(--vio2)}
.bar{height:8px;border-radius:99px;background:#ffffff99;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--vio),var(--pink));transition:width .5s}
.mlist{display:grid;gap:2px;padding:10px}
.mlist button{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:14px;padding:8px 10px;text-align:left;min-height:44px}
.mlist button:hover{background:#ffffff88}.mlist button.cur{background:#fff}
.mlist .n{font-family:'Instrument Serif';font-style:italic;font-size:20px;width:30px;color:var(--mut)}
.mlist .done .n{color:var(--mint)}.mlist b{display:block;font-size:14px;line-height:1.25}.mlist small{display:block;font-size:11px;color:var(--mut)}
.sidelinks{display:grid;gap:6px}
.net{font-size:12px;color:var(--mut);padding-left:6px}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:static;grid-template-columns:1fr}.mlist{grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto}.sidelinks{grid-auto-flow:column;overflow-x:auto}}
.main{display:grid;gap:18px;align-content:start}
.recover{display:flex;align-items:center;gap:14px;padding:12px 18px}
.recover .pct{font-family:'Instrument Serif';font-style:italic;font-size:34px;line-height:1}.recover .bar{flex:1;height:10px}
.brief{padding:clamp(20px,3vw,34px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px}
.brief .mno{font-family:'Instrument Serif';font-style:italic;font-size:22px;color:var(--vio2)}
.brief h2{font-family:'Freesentation','Noto Sans KR';font-weight:900;font-size:clamp(30px,4.4vw,48px);line-height:1.08;margin:2px 0 10px}
.meta{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;margin-bottom:10px}
.pill{border-radius:99px;padding:3px 12px;background:#fff;color:var(--mut);white-space:nowrap}
.pill.off{background:var(--ink);color:#fff;font-weight:700}.pill.time b{color:var(--vio2)}
.story{margin:0 0 12px;max-width:68ch;color:#2c2752}
.mission{background:#fff;border-radius:16px;padding:12px 16px;font-weight:500}
.mission::before{content:"MISSION";font-family:'Instrument Serif';font-style:italic;color:var(--pink);margin-right:10px;font-size:18px}
.aibox{display:grid;gap:8px;min-width:180px;align-content:start}
.aibox .lumi{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut)}
.no-ai .aibox,.no-ai .aigen{display:none}
@media(max-width:700px){.brief{grid-template-columns:1fr}.aibox{grid-template-columns:1fr 1fr}.aibox .lumi{grid-column:1/-1}}
.card{background:var(--glass2);border:1px solid var(--edge);backdrop-filter:blur(16px);border-radius:24px;padding:clamp(16px,2.4vw,26px)}
.card h3{margin:0 0 4px;font-size:20px}.card .sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.off-card{background:var(--ink);color:#fff;border:0}.off-card h3::before{content:"OFFLINE | ";font-family:'Instrument Serif';font-style:italic;color:var(--peach);font-weight:400}
.off-card ol{margin:6px 0 0;padding-left:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.f{display:grid;gap:6px;margin-bottom:12px}.f>span{font-size:14px;font-weight:500}
input,textarea,select{width:100%;font:16px/1.5 'Noto Sans KR',sans-serif;color:var(--ink);background:#ffffffcc;border:1px solid #cfdff2;border-radius:14px;padding:10px 12px;min-height:44px}
textarea{resize:vertical}input::placeholder,textarea::placeholder{color:#9c97bd}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.lt{display:flex;align-items:center;gap:8px;border:1px solid #cfdff2;background:#fff;border-radius:12px;padding:8px 12px;min-height:44px;cursor:pointer}
.lt input{width:auto;min-height:0;accent-color:var(--vio)}.lt i{width:14px;height:14px;border-radius:50%}
.lt.g i{background:#2fbf8f}.lt.y i{background:#ffbf3d}.lt.r i{background:#ff5d6c}.lt:has(input:checked){border-color:var(--vio);box-shadow:0 0 0 3px #f05d2d22}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:12px;padding:7px 12px;font-size:14px;background:#fff}
.chip.v{background:#e3eefb;color:#0b4f9c}.chip.e{background:#fff0e6;color:#a4471f}.chip.m{background:#e4f8f0;color:#16775a}
.lane{border-radius:16px;padding:14px;margin:10px 0}.lane.o{background:#e4f8f0}.lane.s{background:#ffe9ef}
.lane h4{margin:0 0 8px;font-size:15px}
.ign{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 22px}
.ign p{margin:0;color:var(--mut)}.ign .need{color:#c2335f}
.quiz{display:grid;gap:10px}.qi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:#fff;border:2px solid transparent;border-radius:16px;padding:12px 14px}
.qi .ops{display:flex;gap:6px;flex-wrap:wrap}.qi .ops button{border:1px solid #cfdff2;background:#fff;border-radius:999px;min-height:40px;padding:6px 14px}
.qi.ok{border-color:#2fbf8f}.qi.no{border-color:#ff5d6c}.qi .fb{grid-column:1/-1;font-size:14px;color:var(--mut)}
.qi button.pick{background:var(--ink);color:#fff;border-color:var(--ink)}
@media(max-width:600px){.qi{grid-template-columns:1fr}}
.bars{display:grid;gap:8px}.br{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:10px;align-items:center;font-size:14px}
.br .t{position:relative;padding:8px 10px;border-radius:10px;background:#fff;overflow:hidden}
.br .t i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#f05d2d2e,#ff6fae2e);border-right:3px solid var(--vio)}
.br .t span{position:relative}.br .t em{font-style:normal;color:var(--vio2);font-weight:700;margin-right:6px}.br b{text-align:right;color:var(--vio2)}
.cand{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px;margin-bottom:8px}
.stamp{display:flex;align-items:center;gap:14px;margin-top:10px;font-weight:700}
.stamp svg{width:84px;height:84px;flex:none;transition:transform .4s,opacity .4s}.stamp.off svg{opacity:.2;transform:rotate(-20deg) scale(.9)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0}.chk input{width:22px;height:22px;min-height:0;accent-color:var(--vio);margin-top:2px}
.rub{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px;align-items:start}.rub b{padding-top:10px;font-size:14px;color:var(--vio2)}
/* book & hq */
.book{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px}
@media(max-width:900px){.book{grid-template-columns:1fr}}
.toc{display:grid;gap:6px;align-content:start}
.toc button{text-align:left;border:1px solid var(--edge);background:var(--glass);border-radius:16px;padding:10px 14px;min-height:44px}
.toc button.on{background:#fff;border-color:var(--vio)}.toc small{display:block;color:var(--mut);font-size:12px}
.doc{background:#fffdf9;color:#1d2422;border-radius:24px;padding:clamp(18px,4vw,52px);font-size:16px;line-height:1.75;box-shadow:0 20px 50px #d9481c1f}
.doc h2{font-family:'Freesentation','Noto Sans KR';font-weight:900;font-size:30px;line-height:1.2;margin:0 0 10px;color:#0b4f9c}
.doc h3{font-size:22px;margin:34px 0 8px;color:#0b4f9c;border-bottom:2px solid #0b4f9c;padding-bottom:4px}
.doc h4{font-size:18px;margin:22px 0 6px}.doc h5{font-size:16px;margin:16px 0 4px}
.doc table{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}.doc th,.doc td{border:1px solid #d6d1e8;padding:7px 9px;text-align:left;vertical-align:top}
.doc th{background:#e3eefb}.doc blockquote{margin:12px 0;padding:10px 14px;background:#fff1f6;border-left:4px solid var(--pink)}
.doc mark{background:#ffe6d6;color:#8a2a10;padding:0 4px;border-radius:4px}.doc ul{padding-left:22px}.doc .empty{color:#6b6b6b}
.scroll{overflow-x:auto}
.hq table{width:100%;border-collapse:collapse;font-size:14px}.hq th,.hq td{border-bottom:1px solid #cfdff2;padding:10px 8px;text-align:left;vertical-align:middle}
.dots{display:flex;gap:4px}.dots i{width:14px;height:14px;border-radius:50%;background:#fff;border:1px solid #cfdff2}.dots i.on{background:var(--vio);border-color:var(--vio)}
.ring{width:150px;height:150px;flex:none}
/* ai */
#ai{position:fixed;right:16px;top:16px;bottom:16px;width:min(420px,calc(100vw - 32px));background:#ffffffee;backdrop-filter:blur(20px);border:1px solid #fff;border-radius:26px;z-index:40;display:flex;flex-direction:column;box-shadow:0 30px 80px #0b4f9c40}
#ai[hidden]{display:none}
.ai-h{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid #e3eefb}
.ai-h b{font-family:'Instrument Serif';font-style:italic;font-size:26px;font-weight:400}.ai-h small{display:block;color:var(--mut);font-size:13px}
.ai-h .x{margin-left:auto;border:1px solid #e3eefb;background:#fff;border-radius:50%;width:40px;height:40px;font-size:20px}
.ai-out{padding:16px;overflow:auto;flex:1;white-space:pre-wrap;font-size:15px}
.ai-f{padding:12px 16px;border-top:1px solid #e3eefb;display:flex;gap:8px;flex-wrap:wrap}
.dp{display:grid;gap:8px}.dp div{background:#eef4fc;border-radius:12px;padding:8px 10px;font-size:14px}.dp small{display:block;color:var(--vio2);font-size:12px;font-weight:700}
@media(max-width:700px){#ai{top:auto;height:72vh;left:8px;right:8px;width:auto;bottom:8px}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .3s}
#toast.on{opacity:1}
#fx{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:radial-gradient(circle at 50% 45%,#ffffffdd,#b4b0f4ee 60%);text-align:center;padding:20px}
#fx.on{display:grid}#fx .in{max-width:540px}
#fx .clear{font-family:'Instrument Serif';font-style:italic;font-size:clamp(52px,10vw,96px);line-height:1;margin:0;background:linear-gradient(90deg,var(--vio),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
#fx h2{font-family:'Freesentation','Noto Sans KR';font-weight:900;font-size:clamp(24px,4vw,34px);margin:8px 0}
#fx p{font-size:17px;margin:6px 0 20px}
.badge{display:inline-block;background:var(--ink);color:#fff;border-radius:99px;padding:4px 16px;font-weight:700}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;max-width:1240px;width:100%;margin:0 auto;font-size:13px;color:#2c2a63;padding-top:12px}.foot.dark{color:#2c2a63;padding:16px max(3vw,14px) 24px;max-width:1300px}

const setp=(o,p,v)=>{const ks=p.split('.');let a=o;ks.slice(0,-1).forEach(k=>{if(typeof a[k]!=='object'||a[k]===null)a[k]={};a=a[k]});a[ks[ks.length-1]]=v};
const timers={},busy={},again={},dirty={};
function keepLocal(){try{localStorage.setItem('eq-cache',JSON.stringify(cache))}catch(e){}}
function save(id,delay=900){dirty[id]=1;keepLocal();clearTimeout(timers[id]);timers[id]=setTimeout(()=>flush(id),delay)}
async function flush(id){
  if(!db||readonly){dirty[id]=0;return}
  if(busy[id]){again[id]=1;return}
  busy[id]=1;
  try{const {error}=await db.from('ws').upsert({id,data:JSON.parse(JSON.stringify(cache[id]||{})),updated_at:new Date().toISOString()});if(error)throw error;if(!again[id])dirty[id]=0}
  catch(e){if(e&&(e.code==='42501'||/row-level security/i.test(e.message||''))){toast('워크숍 입장 코드가 맞지 않아 서버에 저장되지 않음. 스쿼드 선택 화면에서 코드를 확인해 주세요')}else{toast('저장이 지연됨. 잠시 후 다시 시도함');setTimeout(()=>flush(id),2500+Math.random()*1500)}}
  busy[id]=0;
  if(again[id]){again[id]=0;flush(id)}
}
function setNet(m){netMsg=m;const n=$('#net');if(n)n.textContent=m}
function refreshAfter(cur){
  if(st.view==='stage'){if(cur){syncFields();if(st.stage==='s3')renderStageBody()}live()}
  else if(st.view==='book'||st.view==='fac'){if(!genRunning)render()}
}
async function subscribe(){
  const t=setTimeout(()=>setNet('연결 지연, 이 기기에 임시 저장 중'),10000);
  const {data,error}=await db.from('ws').select('id,data');
  clearTimeout(t);
  if(error){setNet('서버 연결 실패, 이 기기에 저장 중');return}
  (data||[]).forEach(r=>{if(!dirty[r.id])cache[r.id]=r.data||{}});keepLocal();setNet('실시간 동기화 중');refreshAfter(true);
  db.channel('ws-all').on('postgres_changes',{event:'*',schema:'public',table:'ws'},p=>{
    const r=(p.new&&p.new.id)?p.new:p.old;if(!r||!r.id)return;const id=r.id;
    if(dirty[id]||busy[id])return;
    if(p.eventType==='DELETE')delete cache[id];else cache[id]=p.new.data||{};
    keepLocal();refreshAfter(!!(st.team&&id===did(st.team,st.stage)));
  }).subscribe(x=>{if(x==='SUBSCRIBED')setNet('실시간 동기화 중');else if(x==='CHANNEL_ERROR'||x==='TIMED_OUT')setNet('실시간 연결 끊김, 새로고침 필요')});
}

/* ---------- scoring ---------- */
function filled(o,skip){let n=0;for(const k in o){if(skip&&['done','ans','chk','at'].includes(k))continue;const v=o[k];if(typeof v==='string'){if(v.trim())n++}else if(v&&typeof v==='object'&&!Array.isArray(v))n+=filled(v,false);else if(Array.isArray(v))v.forEach(x=>{if(x&&typeof x==='object')n+=filled(x,false)})}return n}
function stats(t){
  let fields=0,done=0,quiz=0,stamp=0;
  STAGES.forEach(s=>{const o=cache[did(t,s.id)]||{};if(o.done)done++;fields+=filled(o,true)});
  const a=(cache[did(t,'s3')]||{}).ans||{};QUIZ.forEach((q,i)=>{if(a['q'+i]===q[1])quiz++});
  const c=(cache[did(t,'s6')]||{}).chk||{};if(['a','b','c','d'].every(k=>c[k]))stamp=1;
  const xp=Math.min(fields,60)*10+done*100+quiz*20+stamp*50;
  let r=0;RANKS.forEach((x,i)=>{if(xp>=x[0])r=i});
  const lo=RANKS[r][0],hi=RANKS[r+1]?RANKS[r+1][0]:lo+600;
  return{fields,done,quiz,stamp,xp,rank:RANKS[r][1],next:RANKS[r+1]?RANKS[r+1][1]:'최고 등급',pct:Math.min(100,Math.round((xp-lo)/(hi-lo)*100))};
}
const levels=()=>Object.fromEntries(ORDER.map(t=>[t,stats(t).done]));

function md2html(md){
  const out=[];let list=0,tbl=null;
  const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/〔(.+?)〕/g,'<mark>〔$1〕</mark>');
  const endTbl=()=>{if(tbl){out.push(tbl+'</tbody></table></div>');tbl=null}};
  const endList=()=>{while(list){out.push('</ul>');list--}};
  String(md||'').split('\n').forEach(raw=>{const l=raw.replace(/\s+$/,'');let m;
    if(/^\s*\|/.test(l)){endList();const cs=l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());if(cs.every(c=>/^:?-{2,}:?$/.test(c)))return;
      if(!tbl)tbl='<div class="scroll"><table><thead><tr>'+cs.map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead><tbody>';else tbl+='<tr>'+cs.map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>';return}
    endTbl();
    if(m=l.match(/^(#{1,4})\s+(.*)/)){endList();const n=m[1].length+1;out.push(`<h${n}>${inl(m[2])}</h${n}>`);return}
    if(m=l.match(/^(\s*)[-*]\s+(.*)/)){const lv=m[1].length>=2?2:1;while(list<lv){out.push('<ul>');list++}while(list>lv){out.push('</ul>');list--}out.push('<li>'+inl(m[2])+'</li>');return}
    if(m=l.match(/^>\s?(.*)/)){endList();out.push('<blockquote>'+inl(m[1])+'</blockquote>');return}
    if(!l.trim()){endList();return}
    endList();out.push('<p>'+inl(l)+'</p>')});
  endTbl();endList();return out.join('');
}

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2600)}

  const fx=$('#fx');

/* ---------- AI ---------- */
let aiCtl=null,lastDraft=null,genRunning=false;
function ctx(t){const d=DOM[t];return `[워크숍] AX-EL Co-Define 「AX 시대, 평가를 다시 쓰다」. 단국대 교수 15명이 5개 학문영역 팀(팀당 3명)으로 나뉘어, 영역별 AX 평가 가이드북 장의 1~4절(기존 평가 진단, 학습목표와 확인할 증거, 개방평가와 보안평가 선택, 대표 평가 재설계 2선)을 워크숍에서 작성하고, 5~6절과 공통 부분은 2차 서면자문으로 완성함.
[용어] 개방평가: AI 활용을 허용, 공개하는 조건에서 과정과 결과를 평가함. 보안평가: 감독하에 학생의 독립 수행을 확인함. 연결형: 개방평가 산출물을 보안평가로 확인함. 평가 설계 순서: 학생이 할 행동 → 확인할 증거 → 평가방법 → 채점 기준.
[표기 규칙] 가운뎃점(U+00B7)은 절대 쓰지 않음. 나열은 쉼표로, 구분은 '와/과' 또는 슬래시로 씀.
[영역] ${d.ch}장 ${d.name} — 핵심 질문: ${d.q}
- 진단 상황: ${d.diag}
- 주요 수행동사: ${d.verbs.join(', ')}
- 개방평가 장면: ${d.open} / 보안평가 장면: ${d.sec}
- 대표 평가 재설계 2선: ${d.tasks.map(x=>x.join(' — ')).join(' / ')}
- 채점 관점: ${d.grade}`}
function teamData(t){const o={};STAGES.forEach(s=>{const v=cache[did(t,s.id)];if(v){const c=JSON.parse(JSON.stringify(v));delete c.done;o[s.n+'단계 '+s.title]=c}});return JSON.stringify(o)}
function openAI(mode){$('#ai').hidden=false;$('#ai-mode').textContent=mode;$('#ai-out').textContent='항로를 계산하는 중…';$('#ai-f').innerHTML=''}
async function ask(prompt,onText,tier){
  if(aiCtl)aiCtl.abort();aiCtl=new AbortController();
  try{const r=await sample(prompt,{onText:onText?({text})=>onText(text):undefined,signal:aiCtl.signal,modelTier:tier||'default',cache:false});return r}
  catch(e){if(e&&e.name!=='AbortError')toast('AI 응답 실패');throw e}
}
async function hint(){
  const S=STAGES.find(x=>x.id===st.stage);openAI(`${S.n}단계 힌트`);
  const p=`${ctx(st.team)}\n\n[현재 단계] ${S.n}단계 「${S.title}」 — ${S.mission}\n[팀이 지금까지 입력한 내용(JSON)]\n${teamData(st.team)}\n\n[요청] 이 팀의 교수들이 스스로 더 나은 답을 만들 수 있도록 힌트 3개를 제시함. 정답을 대신 쓰지 말고 생각을 넓히는 질문이나 점검 관점을 제시함. 입력 내용이 있으면 그 내용에 맞춰 구체적으로 짚음. 각 힌트는 1~2문장, 한국어 개조식 문체(~함, ~음). 근거 없는 통계, 문헌은 쓰지 않음. "- "로 시작하는 3줄만 출력함.`;
  try{const r=await ask(p,t=>{$('#ai-out').textContent=t},'quick');$('#ai-out').textContent=r.text;$('#ai-f').innerHTML='<button class="ghost s" data-act="hint">다른 힌트</button>'}catch(e){if(!(e&&e.name==='AbortError'))$('#ai-out').textContent='힌트를 받지 못함.\n\n원인: '+((e&&e.message)||e)}
}
function flat(o,p='',r={}){for(const k in o){const v=o[k],key=p?p+'.'+k:k;if(v&&typeof v==='object'&&!Array.isArray(v))flat(v,key,r);else r[key]=Array.isArray(v)?v.join(', '):String(v??'')}return r}
async function draft(){
  const S=STAGES.find(x=>x.id===st.stage);openAI(`${S.n}단계 초안`);
  const keys=S.draft.map(k=>`${k} (${labelOf(k)})`);
  const p=`${ctx(st.team)}\n\n[현재 단계] ${S.n}단계 「${S.title}」 — ${S.mission}\n[팀이 지금까지 입력한 내용(JSON)]\n${teamData(st.team)}\n\n[요청] 아래 키에 들어갈 초안을 작성함. 이미 입력된 내용과 일관되게, ${DOM[st.team].name} 영역 수업에 실제로 적용할 수 있을 만큼 구체적으로 씀. 한국어 개조식 문체(~함), 각 값 1~3문장. 근거 없는 통계, 문헌은 쓰지 않음. 수행동사 키는 주요 수행동사 중에서 고름. AI 조건 키(oAi)는 "허용+공개", "제한 허용", "필수 활용" 중 하나로 씀.\n키 목록:\n${keys.join('\n')}\n\n출력: 위 키(괄호 앞 문자열)를 그대로 쓴 평면 JSON 객체 하나만 출력함. 코드블록이나 설명 없이.`;
  try{
    const r=await ask(p,t=>{$('#ai-out').textContent='초안을 쓰는 중…\n\n'+t.slice(-400)});
    const m=r.text.match(/\{[\s\S]*\}/);if(!m)throw new Error('parse');
    const obj=flat(JSON.parse(m[0]));lastDraft={};S.draft.forEach(k=>{if(obj[k]&&obj[k].trim())lastDraft[k]=obj[k].trim()});
    const o=sd(),out=$('#ai-out');out.textContent='';const box=document.createElement('div');box.className='dp';
    Object.entries(lastDraft).forEach(([k,v])=>{const dv=document.createElement('div'),sm=document.createElement('small');sm.textContent=labelOf(k)+(String(getp(o,k)||'').trim()?' | 이미 입력됨(유지)':'');dv.append(sm,document.createTextNode(v));box.append(dv)});
    out.append(box);
    $('#ai-f').innerHTML='<button class="btn" data-act="apply">빈 칸에 채우기</button><button class="ghost s" data-act="draft">다시 생성</button>';
  }catch(e){if(!(e&&e.name==='AbortError'))$('#ai-out').textContent='초안을 만들지 못함.\n\n원인: '+((e&&e.message)||e);$('#ai-f').innerHTML='<button class="ghost s" data-act="draft">다시 생성</button>'}
}
function applyDraft(){
  if(!lastDraft)return;const o=sd();let n=0;
  Object.entries(lastDraft).forEach(([k,v])=>{if(String(getp(o,k)||'').trim())return;const el=$(`[data-k="${k}"]`);
    if(el&&el.tagName==='SELECT'&&![...el.options].some(op=>op.value===v))return;setp(o,k,v);n++});
  save(did(st.team,st.stage),200);syncFields();live();toast(`빈 칸 ${n}개를 채움 — 팀 의도에 맞게 고쳐 씀`);
}
async function genChapter(t,quiet){
  if(!sample)return;genRunning=true;
  if(!quiet){st.view='book';st.bookSel=t;render()}
  const el=$('#doc'),base=chapterMd(t);
  if(el&&st.bookSel===t)el.innerHTML='<p class="empty">AI 코파일럿 LUMI가 원고를 다듬는 중…</p>';
  const p=`${ctx(t)}\n\n[요청] 아래는 워크숍에서 교수 팀이 입력한 내용을 기계적으로 조립한 가이드북 ${t}장 원고임. 다른 교수가 읽고 자기 수업에 바로 적용할 수 있는 가이드북 원고로 다듬음.\n- 장 제목과 1~6절 제목, 순서를 유지함\n- 1~4절: 교수 입력 내용을 빠짐없이 반영하고 문장을 정돈함. 입력에 없는 사실, 수치, 사례, 문헌을 지어내지 않음. 〔미입력〕 부분은 그대로 둠\n- 마크다운 표는 표로 유지함\n- 5~6절: 제목의 〔2차 서면자문 보완〕 표시를 유지하고, 그 아래에 "자문 검토용 초안" 문단으로 채점 관점과 자료 구성을 간략히 제시함\n- "이 장을 쓴 교수들의 한 줄" 절이 있으면 유지함\n- 문체: 한국어 학술 개조식(~함, ~음)\n- 마크다운만 출력함\n\n[조립본]\n${base}`;
  let last=0;
  try{
    const r=await ask(p,txt=>{const now=Date.now();if(now-last<400)return;last=now;const d=$('#doc');if(d&&st.view==='book'&&st.bookSel===t)d.innerHTML=md2html(txt)},'default');
    let md=r.text.replace(/^```(?:markdown)?\s*|\s*```$/g,'').trim();if(r.truncated)md+='\n\n〔원고가 길어 일부가 잘렸음 — 다시 생성 필요〕';
    cache[did(t,'draft')]={md,at:new Date().toISOString(),by:st.me||''};save(did(t,'draft'),100);toast(`${t}장 AI 원고를 저장함`);
  }catch(e){toast(`${t}장 원고 생성 실패`)}
  genRunning=false;if(st.view==='book'||st.view==='fac')render();
}
async function genAll(){for(const t of ORDER){if((cache[did(t,'draft')]||{}).md)continue;toast(`${t}장 원고 생성 중`);await genChapter(t,true)}toast('일괄 생성 완료');}
async function saveFile(name,text,type){
  try{const u=URL.createObjectURL(new Blob([text],{type:type+';charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return}catch(e){}
  try{await navigator.clipboard.writeText(text);toast('내려받기를 쓸 수 없어 클립보드에 복사함')}catch(e){toast('내려받기를 쓸 수 없음')}
}
function htmlDoc(){return `<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>AX 시대, 평가를 다시 쓰다 — 워크숍판 초안</title><style>body{font-family:'Malgun Gothic','Noto Sans KR',sans-serif;max-width:860px;margin:40px auto;line-height:1.75;color:#1d2422;padding:0 20px}h2{font-size:26px;color:#0f3b47}h3{font-size:20px;color:#0f3b47;border-bottom:2px solid #0f3b47;padding-bottom:4px;margin-top:32px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid #bbb;padding:6px 8px;vertical-align:top;text-align:left}th{background:#eee}blockquote{background:#fff6d6;border-left:4px solid #e0a800;margin:12px 0;padding:8px 12px}mark{background:#ffe1d6}</style></head><body>${md2html(bookMd())}</body></html>`}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='start'){const h=$('#heroName');if(h){st.me=h.value.trim();keepSt()}st.view='pick';render();scrollTo(0,0)}
  else if(a==='setcode'){const v=($('#wscode')||{}).value||'';try{localStorage.setItem('eq-code',v.trim())}catch(e){}location.reload()}
  else if(a==='pick'){st.view='pick';render();scrollTo(0,0)}
  else if(a==='motion'){document.body.classList.toggle('still');b.classList.toggle('on',!document.body.classList.contains('still'))}
  else if(a==='home'){st.view='title';render();scrollTo(0,0)}
  else if(a==='pickteam'){st.team=b.dataset.t;keepSt();render()}
  else if(a==='begin'){keepSt();const first=STAGES.find(x=>!(cache[did(st.team,x.id)]||{}).done);st.stage=first?first.id:'s7';st.view='stage';render();scrollTo(0,0)}
  else if(a==='stage'){st.view=st.team?'stage':'pick';render()}
  else if(a==='go'){st.stage=b.dataset.s;st.view='stage';keepSt();render();scrollTo(0,0)}
  else if(a==='ignite'){const S=STAGES.find(x=>x.id===st.stage);if(missing(S).length)return;const o=sd();o.done=true;o.at=new Date().toISOString();save(did(st.team,S.id),50);live();celebrate(S)}
  else if(a==='fxclose'){const fx=$('#fx');fx.classList.remove('on');const n=fx.dataset.next;if(n==='book'){st.view='book';st.bookSel=st.team}else{st.stage=n;keepSt()}render();scrollTo(0,0)}
  else if(a==='quiz'){const o=sd();o.ans=o.ans||{};o.ans['q'+b.dataset.q]=b.dataset.v;save(did(st.team,'s3'),300);renderStageBody()}
  else if(a==='prefill-cands'){const o=sd(),s4=cache[did(st.team,'s4')]||{};o.cands=o.cands||[];[s4.v1,s4.v2].forEach((v,i)=>{if(v&&v.core&&!(o.cands[i]&&o.cands[i].t)){o.cands[i]=Object.assign({},o.cands[i],{t:v.core})}});for(let i=0;i<3;i++)if(!o.cands[i])o.cands[i]={};save(did(st.team,'s5'),200);syncFields();live()}
  else if(a==='prefill-tasks'){const o=sd(),d=DOM[st.team];if(!(o.task1||'').trim())o.task1=d.tasks[0].join(' — ');if(!(o.task2||'').trim())o.task2=d.tasks[1].join(' — ');save(did(st.team,'s5'),200);syncFields();live()}
  else if(a==='hint'){if(sample)hint()}
  else if(a==='draft'){if(sample)draft()}
  else if(a==='apply')applyDraft();
  else if(a==='closeai'){$('#ai').hidden=true;if(aiCtl)aiCtl.abort()}
  else if(a==='book'){st.view='book';if(st.bookSel!=='all'&&!ORDER.includes(st.bookSel)&&!['front','back'].includes(st.bookSel))st.bookSel='all';render();scrollTo(0,0)}
  else if(a==='fac'){st.view='fac';render();scrollTo(0,0)}
  else if(a==='bsel'){st.bookSel=b.dataset.k;render()}
  else if(a==='gen'){genChapter(b.dataset.t)}
  else if(a==='undraft'){const t=b.dataset.t;cache[did(t,'draft')]={md:'',at:new Date().toISOString()};save(did(t,'draft'),100);render()}
  else if(a==='genall'){genAll()}
  else if(a==='dl-md')saveFile('AX평가가이드북_워크숍판초안.md',bookMd(),'text/markdown');
  else if(a==='dl-html')saveFile('AX평가가이드북_워크숍판초안.html',htmlDoc(),'text/html');
  else if(a==='copy'){try{await navigator.clipboard.writeText(bookMd());toast('가이드북 전체를 복사함')}catch(err){toast('복사하지 못함')}}
});
function onField(e){
  const el=e.target.closest('[data-k]');if(!el||!st.team||st.view!=='stage')return;
  let v=el.type==='checkbox'?el.checked:el.value;
  setp(sd(),el.dataset.k,v);save(did(st.team,st.stage));live();
}

render();
(()=>{
  const C=window.SAVE_DKU||{};
  try{const q=new URLSearchParams(location.search).get('code');if(q){localStorage.setItem('eq-code',q);history.replaceState(null,'',location.pathname)}}catch(e){}
  if(!C.supabaseUrl||!C.supabaseAnonKey||!window.supabase){setNet('이 기기에만 저장됨');document.body.classList.add('no-ai');return}
  const headers={'x-ws-code':wsCode()};
  db=window.supabase.createClient(C.supabaseUrl,C.supabaseAnonKey,{global:{headers}});
  const fn=C.supabaseUrl.replace(/\/$/,'')+'/functions/v1/'+(C.aiFunction||'ai');
  sample=async(prompt,opts={})=>{
    let res;
    try{res=await fetch(fn,{method:'POST',signal:opts.signal,headers:{'Content-Type':'application/json','apikey':C.supabaseAnonKey,'Authorization':'Bearer '+C.supabaseAnonKey,'x-ws-code':wsCode()},body:JSON.stringify({prompt:typeof prompt==='string'?prompt:JSON.stringify(prompt),tier:opts.modelTier||'default'})})}
    catch(e){if(e&&e.name==='AbortError')throw e;throw {code:'unavailable',message:String(e)}}
    if(!res.ok||!res.body){let b='';try{b=(await res.text()).slice(0,300)}catch(e){}
      const msg=res.status===403?'입장 코드가 서버의 WORKSHOP_CODE와 다름 (현재 이 기기 코드: '+(wsCode()?'입력됨':'없음')+')':res.status===500&&/server_not_configured/.test(b)?'서버 설정 누락: Supabase Secrets에 OPENAI_API_KEY 또는 OPENAI_MODEL이 없음':res.status===502||res.status===429?'OpenAI 호출 실패 (OpenAI 응답 코드 '+((b.match(/"status":(\d+)/)||[])[1]||res.status)+'). 401은 API 키 오류, 404는 모델명 오류, 429는 결제·한도 문제':'HTTP '+res.status+' '+b;
      throw {code:res.status===429?'rate_limited':'ai_error',message:msg}}
    const rd=res.body.getReader(),dec=new TextDecoder();let buf='',text='',truncated=false;
    for(;;){const {value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
      let i;while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
        if(!line.startsWith('data:'))continue;const d=line.slice(5).trim();if(d==='[DONE]')continue;
        try{const j=JSON.parse(d),ch=j.choices&&j.choices[0];if(ch){if(ch.delta&&ch.delta.content){text+=ch.delta.content;if(opts.onText)opts.onText({text,delta:ch.delta.content})}if(ch.finish_reason==='length')truncated=true}}catch(e){}}}
    return {text,truncated};
  };
  document.body.classList.remove('no-ai');
  setNet('동기화 연결 중');subscribe();
})();
}
